# =====================================================================
# Nginx Reverse Proxy Configuration for Omnichannel Branch Assistant
# Location: /etc/nginx/sites-available/omnichannel.conf
# Enable: ln -s /etc/nginx/sites-available/omnichannel.conf /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx
# =====================================================================

# Rate limiting zone (60 requests per minute per IP, bursts allowed)
limit_req_zone $binary_remote_addr zone=omni_api_limit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Replace with your domain or server IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is generated)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to FastAPI Omnichannel Backend
    location / {
        limit_req zone=omni_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for live chat, real-time log streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for streaming AI responses and Long Polling
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # WhatsApp Bridge is internal - Access is only via Backend (/api/channels/whatsapp)
    # Never expose port 3001 directly to the public web!
}

